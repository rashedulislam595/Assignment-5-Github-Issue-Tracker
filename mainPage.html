<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issue Tracker | Main Page</title>

    <!-- DaisyUI and Tailwind Css -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font- Geist -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- font awesome Cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


    <style>
        * {
            font-family: "Geist", sans-serif;

        }
    </style>
</head>

<body class="bg-base-200">
    <header class="bg-[#FFFFFF] ">
        <nav class="w-11/12 mx-auto ">
            <div class="navbar felx justify-between items-center  gap-3">
                <div class="flex items-center gap-1">
                    <img class=" w-[50px]" src="./assets/github-logo.png" alt="">
                    <h2 class="hidden md:inline text-xl md:text-2xl text-[#1F2937] font-semibold ">GitHub Issues Tracker</h2>
                </div>
                <div class="flex gap-1 md:gap-4 items-center">
                    <label class="input w-[70%] md:w-full">
                        <svg class="w-4 opacity-50 text-[#64748B]" xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24">
                            <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                                stroke="currentColor">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.3-4.3"></path>
                            </g>
                        </svg>
                        <input id="search-input" type="search" required placeholder="Search issues..."
                            class="text-[#64748B] text-[16px]" />
                    </label>
                    <button id="search-btn" class="btn btn-primary font-semibold md:text-[16px]"><i class="fa-solid fa-plus"></i> New Issue</button>
                </div>
            </div>
        </nav>
        <hr class="text-[#e8e9e9] shadow-sm">
    </header>

    <main class="w-10/12 mx-auto mb-16">
        <!-- tab section -->
        <section>
            <!-- tab container -->
            <div class="flex gap-2 bg-[#FFFFFF] p-6 rounded-lg mt-[60px] mb-4 shadow-sm">
                <button onclick="buttonActive('all')" id="all-btn"
                    class="btn btn-primary font-semibold md:text-[16px] sm:px-12 px-8">All</button>
                <button onclick="buttonActive('open')" id="open-btn"
                    class="btn text-[#64748B] bg-[#FFFFFF] font-medium md:text-[16px] px-5 sm:px-9">Open</button>
                <button onclick="buttonActive('closed')" id="closed-btn"
                    class="btn text-[#64748B] bg-[#FFFFFF] font-medium md:text-[16px] px-5 sm:px-8">Closed</button>
            </div>
            <!-- issue count & open,closed marker -->
            <div class="flex justify-between items-center bg-[#FFFFFF] p-6 rounded-lg shadow-sm">
                <!-- left  -->
                <div class="flex gap-2 items-center">
                    <div class=" w-12 p-2 bg-[#ECE4FF] rounded-full">
                        <img src="./assets/Aperture.png" alt="">
                    </div>
                    <div>
                        <h2 class="text-xl text-[#1F2937] font-semibold"><span id="issue-count">0</span> Issues</h2>
                        <p class="text-[#64748B]">Track and manage your project issues</p>
                    </div>
                </div>
                <!-- right -->
                <div class="flex flex-row gap-4">
                    <div class="flex flex-row items-center gap-2">
                        <div class="w-3 h-3 rounded-full bg-[#00A96E]"></div>
                        <p class="text-[#1F2937] font-medium">Open</p>
                    </div>
                    <div class="flex flex-row items-center gap-2">
                        <div class="w-3 h-3 rounded-full bg-[#A855F7]"></div>
                        <p class="text-[#1F2937] font-medium">Closed</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- issue  -->
        <section>
            <!-- issue container -->
            <div id="issue-container"
                class="p-6 shadow-xl rounded-lg grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 ">

            </div>

            <!-- loading -->
            <div id="loading-container" class="text-center hidden mt-44">
                <span class="loading loading-spinner text-neutral"></span>
                <span class="loading loading-spinner text-info"></span>
            </div>
        </section>

        <!-- modal -->
        <section id="modal-container">
            <!-- Open the modal using ID.showModal() method -->
            <!-- <button class="btn" onclick="issue_modal.showModal()">open modal</button> -->
            
        </section>
    </main>

    <!-- js -->
    <script src="js/main.js"></script>
</body>

</html>
